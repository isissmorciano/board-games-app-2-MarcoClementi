<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Nuovo Gioco</title>
  </head>
  <body>
    <h1>Crea nuovo Gioco</h1>
    <p><a href="{{ url_for('index') }}">Torna alla lista dei giochi</a></p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
        {% for category, msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('new_gioco') }}">
      <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
      </div>
      <div>
        <label for="numero_giocatori_massimo">Numero giocatori massimo:</label>
        <input type="number" id="numero_giocatori_massimo" name="numero_giocatori_massimo" min="1" required>
      </div>
      <div>
        <label for="durata_media">Durata media (min):</label>
        <input type="number" id="durata_media" name="durata_media" min="1" required>
      </div>
      <div>
        <label for="categoria">Categoria:</label>
        <input type="text" id="categoria" name="categoria" required>
      </div>
      <div>
        <button type="submit">Crea Gioco</button>
      </div>
    </form>

  </body>
</html>
