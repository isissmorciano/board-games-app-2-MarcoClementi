<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <title>Nuovo Gioco</title> 
    </head>
    <body>
    <h1>Crea nuovo Gioco</h1>
    <p><a href="{{ url_for('index') }}">Torna alla lista dei giochi</a></p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
        {% for category, msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
